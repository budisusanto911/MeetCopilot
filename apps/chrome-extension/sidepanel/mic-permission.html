<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Izin Mikrofon — MeetCopilot</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    button {
      margin-top: 14px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-top: 12px;
      color: #34d399;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Izin Mikrofon MeetCopilot</h2>
    <p>Chrome Side Panel tidak bisa memunculkan popup izin mikrofon secara langsung. Klik tombol di bawah lalu pilih <strong>Allow</strong> sekali saja.</p>
    <button id="grantBtn" type="button">Izinkan Mikrofon</button>
    <p id="status"></p>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
